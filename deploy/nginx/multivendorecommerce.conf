# ==============================================================================
# OneStall Marketplace — Production Nginx Configuration
# Path: /etc/nginx/sites-available/multivendorecommerce.conf
# Symlink: /etc/nginx/sites-enabled/multivendorecommerce.conf
# ==============================================================================

# 1. Cloudflare Real IP Restoration (Trust Cloudflare Edge Proxies)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# 2. Upstream Definitions
upstream php_fpm {
    server unix:/var/run/php/php8.2-fpm.sock max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream reverb_ws {
    server 127.0.0.1:8080;
    keepalive 64;
}

# 3. HTTP Server (Redirect all traffic to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name onestall.in www.onestall.in;

    # Allow Let's Encrypt / ACME challenges
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/multivendorecommerce/current/public;
        allow all;
    }

    location / {
        return 301 https://onestall.in$request_uri;
    }
}

# 4. HTTPS Server (Main Marketplace Application)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.onestall.in;

    # Canonical redirect www to apex domain
    ssl_certificate /etc/ssl/certs/onestall.in.crt;
    ssl_certificate_key /etc/ssl/private/onestall.in.key;

    return 301 https://onestall.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name onestall.in;

    root /var/www/multivendorecommerce/current/public;
    index index.php index.html;

    # SSL / TLS Hardening
    ssl_certificate /etc/ssl/certs/onestall.in.crt;
    ssl_certificate_key /etc/ssl/private/onestall.in.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security Headers (Supplements Laravel SecurityHeadersMiddleware)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Maximum payload size for merchant document and high-res image uploads
    client_max_body_size 64M;
    client_body_buffer_size 128k;

    # Timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;
    send_timeout 30s;

    # Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/x-javascript application/xml application/xml+rss image/svg+xml;

    # Logging
    access_log /var/log/nginx/onestall_access.log combined buffer=64k flush=5s;
    error_log /var/log/nginx/onestall_error.log warn;

    # Health Check endpoints (Unlogged for minimal noise)
    location ~ ^/(up|healthz|api/v1/health)$ {
        try_files $uri $uri/ /index.php?$query_string;
        access_log off;
    }

    # Laravel Reverb WebSockets Proxy (/app, /apps)
    location /app {
        proxy_pass http://reverb_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location /apps {
        proxy_pass http://reverb_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # Static Assets with Aggressive Browser & CDN Caching
    location ~* \.(jpg|jpeg|gif|png|webp|avif|css|js|ico|woff2|woff|ttf|svg|mp3|ogg)$ {
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Vite / Build Artifacts
    location ^~ /build/ {
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Block access to hidden files (.env, .git, .htaccess)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block direct access to storage internals & sensitive configs
    location ~ ^/(storage/logs|bootstrap/cache|config)/ {
        deny all;
        return 404;
    }

    # Main Application Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Handler
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_SCHEME https;

        # FastCGI Buffers & Performance
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_connect_timeout 10s;
        fastcgi_intercept_errors off;
    }
}
