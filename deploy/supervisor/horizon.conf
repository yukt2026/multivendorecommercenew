# ==============================================================================
# OneStall Marketplace — Supervisor Configuration: Laravel Horizon
# Path: /etc/supervisor/conf.d/onestall-horizon.conf
# ==============================================================================

[program:onestall-horizon]
process_name=%(program_name)s
command=/usr/bin/php8.2 /var/www/multivendorecommerce/current/artisan horizon
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/multivendorecommerce/current/storage/logs/horizon.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stopwaitsecs=3600
stopsignal=SIGTERM
priority=998
