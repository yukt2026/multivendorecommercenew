# ==============================================================================
# OneStall Marketplace — Supervisor Configuration: Standalone Queue Workers
# Path: /etc/supervisor/conf.d/onestall-worker.conf
# Note: Use this when Horizon is disabled, or to run dedicated workers.
# ==============================================================================

[program:onestall-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php8.2 /var/www/multivendorecommerce/current/artisan queue:work redis --queue=high,notifications,default,sync,low --sleep=3 --tries=3 --max-time=3600 --memory=256
autostart=true
autorestart=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/multivendorecommerce/current/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stopwaitsecs=3600
stopsignal=SIGTERM
priority=999
